<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123b67">
    <title>{% block title %}PagaFácil{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  </head>
  <body>
    {% if user %}
    <header class="site-header">
      <nav class="site-nav" aria-label="Main navigation">
        <a class="wordmark" href="{{ url_for('checkout') }}" aria-label="PagaFácil home">
          Paga<span>Fácil</span>
        </a>
        <div class="nav-links">
          <a href="{{ url_for('checkout') }}">Checkout</a>
          <a href="{{ url_for('my_loans') }}">My loans</a>
        </div>
        <div class="account-menu">
          <span class="account-name">Hi, {{ user['display_name'] }}</span>
          <form method="post" action="{{ url_for('logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="button button-quiet" type="submit">Sign out</button>
          </form>
        </div>
      </nav>
    </header>
    {% endif %}
    <main class="{% block main_class %}page-shell{% endblock %}">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <p>Simulated environment: all accounts, purchases and balances are simulated. No real money moves.</p>
    </footer>
  </body>
</html>
